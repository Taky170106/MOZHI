<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rig check — fingerspelling hand</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 1.4rem 1.6rem 3rem;
    background: #0c0a16; color: #f1efea;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }
  h1 { font-size: 1rem; margin: 0 0 .2rem; }
  p.sub { margin: 0 0 1.1rem; color: #a9a5bd; max-width: 70ch; }
  .cols { display: flex; gap: 1.4rem; align-items: flex-start; flex-wrap: wrap; }
  #stage canvas { width: 430px; height: 430px; border-radius: 12px; display: block; }
  pre { margin: 0; padding: 1rem 1.1rem; background: #16132a; border-radius: 12px; color: #cfc9e8; }
  .rail { display: flex; flex-wrap: wrap; gap: .3rem; margin: .9rem 0; max-width: 430px; }
  button {
    padding: .35rem .6rem; min-width: 2rem;
    background: #191630; color: #ded9f2; border: 1px solid #2c2748;
    border-radius: 7px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: #5a4fd0; }
  button.on { background: #4b3ecf; border-color: #6f63e8; color: #fff; }
  h2 { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: #8d87ab; margin: 1rem 0 .1rem; }
</style>
</head>
<body>
  <h1>Rig check</h1>
  <p class="sub">
    One handshape, held still, with the camera on the wrist. Pass a different
    model with <code>?vrm=./avatar/other.vrm</code>.
  </p>

  <div class="cols">
    <div>
      <div id="stage"></div>
      <h2>Letters and digits</h2>
      <div class="rail" id="rail"></div>
      <h2>Whole signs</h2>
      <div class="rail" id="signs"></div>
      <h2>Named handshapes</h2>
      <div class="rail" id="shapes"></div>
      <div class="rail">
        <button id="follow">Camera: hand</button>
        <button id="contact">Contact sheet</button>
      </div>
      <h2>Sheets of twelve</h2>
      <div class="rail" id="sheets"></div>
      <img id="sheet" hidden alt="every letter at once" style="width:100%;max-width:760px;border-radius:12px;margin-top:12px" />
    </div>
    <pre id="readout">loading…</pre>
  </div>

  <script type="module" src="/src/dev/rig-check.ts"></script>
</body>
</html>
